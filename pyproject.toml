[project]
name = "usefultext"
dynamic = ["version"]
description = "Turns photos of document pages into text and markdown, entirely on your machine"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Simmons" }]
dependencies = [
    # The pipeline (Milestone 1). Major versions pinned to what was verified together.
    "rapidocr>=3.9,<4",
    "onnxruntime>=1.20,<2",
    "pillow>=10.2",
    "pillow-heif>=1.0",
    "pymupdf>=1.24",
    "numpy>=1.26,<3",
    # The app (Milestone 2).
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "platformdirs>=4.2",
    "send2trash>=1.8",
    # Step 4: suspect words (flags only) and the Word export.
    "pyspellchecker>=0.8",
    "python-docx>=1.1",
    # Step 5: the desktop window (WKWebView / WebView2 / WebKitGTK); a browser tab otherwise.
    "pywebview>=5",
]

[project.scripts]
usefultext = "usefultext.cli:main"
usefultext-app = "app.launcher:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
build = ["pyinstaller>=6.11"]

[project.urls]
Homepage = "https://github.com/tuoa-tools/usefultext"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "usefultext.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["usefultext*", "app*"]

[tool.setuptools.package-data]
app = ["static/**/*"]  # the built UI travels with the package (step 3)

[tool.pytest.ini_options]
testpaths = ["tests"]
