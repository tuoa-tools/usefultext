line-length = 100
target-version = "py313"
# Gitignored folders (.venv, Documents, output*, fixtures/derived, the POC) are skipped by default.
extend-exclude = ["frontend", "fixtures"]

[lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[lint.isort]
known-first-party = ["usefultext", "app"]

[format]
# settings.py keeps its hand-aligned comment columns: every threshold with its calibration note.
exclude = ["usefultext/settings.py"]
